name: Guga CI

on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guga-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop regression tests
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q core ui tools launcher.py main.py
      - name: Run desktop, memory, daily-plan and voice regressions
        run: >-
          python -m unittest
          tools.test_independent_chat
          tools.test_companion_chat
          tools.test_companion_memory
          tools.test_driver_voice_repair
          tools.test_floating_chat
          tools.test_fresh_context
          tools.test_recording_draft
          tools.test_realtime_voice
          tools.test_long_voice_stability
          tools.test_voice_resilience
          tools.test_voice_conversation_controls
          tools.test_daily_plan
          tools.test_super_agent_tools
          -v

  plugin:
    name: Plugin contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check plugin syntax
        run: node --check plugins/dsh-guga-desktop/index.mjs
      - name: Run native DSH plugin contract tests
        run: node tools/test_dsh_plugin_events.mjs
